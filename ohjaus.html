<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suorittajan ohjaus</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#101414;color:white;margin:0;padding:20px}.wrap{max-width:480px;margin:auto}h1{font-size:24px}.card{background:#202626;border-radius:14px;padding:18px;margin:14px 0}.muted{color:#bac4c0;font-size:14px}input{width:100%;padding:13px;border-radius:8px;border:1px solid #68736e;background:#080a0a;color:white;margin:7px 0 12px}button{border:0;border-radius:10px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;width:100%;margin:5px 0;background:#ffe500;color:#080a0a}button.secondary{background:#39433f;color:white}button.green{background:#78d64b}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font-size:18px;font-weight:bold;margin:8px 0}.small{font-size:12px;color:#aab5b0;line-height:1.5}</style></head><body><div class="wrap"><h1>Suorittajan ohjaus</h1><div class="card"><label>GitHub-tunniste (fine-grained token)</label><input id="token" type="password" autocomplete="off" placeholder="Liitä tunniste tähän"><label>GitHub-käyttäjä / organisaatio</label><input id="owner" value="ripsmooth"><label>Repository</label><input id="repo" value="ripsmooth.github.io"><label>Haara</label><input id="branch" value="main"><p class="small">Tunnistetta ei tallenneta eikä se ole grafiikan HTML-tiedostossa. Liitä se ohjaussivulle käytön ajaksi.</p></div><div class="card"><div class="muted">Nykyinen tila</div><div class="status" id="current">Yhdistetään…</div><div class="buttons"><button class="secondary" id="prev">← Edellinen</button><button id="next">Seuraava →</button></div><button class="green" id="auto">Automaattinen aikataulu</button><div class="small" id="msg">Käsitilassa grafiikka pysyy valitussa suorittajassa.</div></div></div><script>
const $=id=>document.getElementById(id);let state={mode:'auto',index:0};
function cfg(){return {token:$('token').value.trim(),owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()}}
async function api(path,opts={}){const c=cfg();if(!c.token)throw Error('Lisää GitHub-tunniste.');const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});if(!r.ok)throw Error('GitHub vastasi: '+r.status+' '+(await r.text()).slice(0,180));return r.status===204?null:r.json()}
async function readState(){const c=cfg();const r=await fetch(`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/state.json?t=${Date.now()}`,{cache:'no-store'});if(r.ok)state=await r.json();paint()}
async function send(mode,index){try{$('msg').textContent='Lähetetään komentoa…';const c=cfg();await api(`/repos/${c.owner}/${c.repo}/actions/workflows/set-state.yml/dispatches`,{method:'POST',body:JSON.stringify({ref:c.branch,inputs:{mode,index:String(index)}})});state={mode,index};paint();$('msg').textContent='Komento lähetetty. Grafiikka päivittyy, kun GitHub Actions on käsitellyt sen.';}catch(e){$('msg').textContent=e.message;}}
function paint(){$('current').textContent=state.mode==='manual'?'Manuaali: suorittaja nro '+(Number(state.index)+1):'Automaattinen aikataulu';}
$('prev').onclick=()=>send('manual',Math.max(0,Number(state.index)-1));$('next').onclick=()=>send('manual',Math.min(57,Number(state.index)+1));$('auto').onclick=()=>send('auto',0);
$('token').addEventListener('change',()=>readState().catch(e=>$('msg').textContent=e.message));readState().catch(e=>{$('current').textContent='Ei yhteyttä';$('msg').textContent=e.message});
</script></body></html>
