name: Set performer state
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto or manual'
        required: true
        type: choice
        options: [auto, manual]
      index:
        description: 'Zero-based performer index'
        required: true
        type: string
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update state
        env:
          MODE: ${{ inputs.mode }}
          INDEX: ${{ inputs.index }}
        run: |
          python - <<'PY'
          import json, os
          mode=os.environ['MODE']
          index=max(0,min(57,int(os.environ['INDEX'])))
          with open('state.json','w',encoding='utf-8') as f:
              json.dump({'mode':mode,'index':index},f,ensure_ascii=False)
              f.write('\n')
          PY
      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m 'Update performer state'
          git push
