name: Set performer state

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto or manual'
        required: true
        type: choice
        options: [auto, manual]
      index:
        description: 'Zero-based performer index'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: performer-state-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update state
        env:
          MODE: ${{ inputs.mode }}
          INDEX: ${{ inputs.index }}
        run: |
          python - <<'PY'
          import json, os

          mode = os.environ['MODE']
          index = max(0, min(57, int(os.environ['INDEX'])))

          with open('state.json', 'w', encoding='utf-8') as f:
              json.dump({'mode': mode, 'index': index}, f, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Commit state
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add state.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m 'Update performer state'

          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
